ion: relative;\n  width: 100%;\n  max-width: 480px;\n  margin: 0 auto;\n  background: var(--background);\n  min-height: 100vh;\n  min-height: 100dvh;\n  overflow: hidden;\n}\n\n.view {\n  display: flex;\n  flex-direction: column;\n  height: 100dvh;\n  background: var(--background);\n}\n\n/* ===================== \u9876\u90e8\u6807\u9898\u680f ===================== */\n.app-header {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 16px 8px;\n  background: var(--background);\n}\n\n.app-header--compact { padding-bottom: 10px; }\n\n.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }\n\n.brand-icon {\n  width: 42px;\n  height: 42px;\n  flex: none;\n  padding: 9px;\n  border-radius: 50%;\n  background: var(--primary);\n  color: #fff;\n}\n\n.brand-text { min-width: 0; }\n.brand-text h1 {\n  margin: 0;\n  font-size: 18px;\n  font-weight: 700;\n  letter-spacing: 0.2px;\n}\n.brand-text p {\n  margin: 1px 0 0;\n  font-size: 12px;\n  color: var(--muted-foreground);\n}\n\n.header-actions { display: flex; align-items: center; gap: 12px; flex: none; }\n\n.ghost-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  font-size: 12.5px;\n  color: var(--foreground);\n  padding: 4px 2px;\n  border-radius: 8px;\n}\n.ghost-btn svg { width: 17px; height: 17px; flex: none; }\n.ghost-btn:active { opacity: 0.6; }\n.ghost-btn.is-on { color: var(--primary); font-weight: 600; }\n.ghost-btn--icon { padding: 6px; }\n.ghost-btn--icon svg { width: 22px; height: 22px; }\n\n/* ===================== \u514d\u8d23\u58f0\u660e / \u63d0\u793a\u6761 ===================== */\n.disclaimer {\n  margin: 0 16px 8px;\n  padding: 8px 12px;\n  background: var(--muted);\n  border-radius: 10px;\n  font-size: 12px;\n  color: var(--muted-foreground);\n}\n\n.a2hs {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 0 16px 10px;\n  padding: 10px 12px;\n  background: var(--primary-soft);\n  border: 1px solid #cfe8ee;\n  border-radius: 10px;\n  font-size: 12.5px;\n  color: #1f6b7a;\n}\n.a2hs-icon { width: 17px; height: 17px; flex: none; }\n.a2hs-text { flex: 1; }\n.a2hs-close { width: 16px; height: 16px; flex: none; color: #1f6b7a; opacity: 0.75; }\n\n/* ===================== \u5206\u6bb5\u63a7\u4ef6 ===================== */\n.segmented {\n  display: flex;\n  gap: 4px;\n  margin: 0 16px 10px;\n  padding: 4px;\n  background: var(--muted);\n  border-radius: 12px;\n}\n.seg-btn {\n  flex: 1;\n  padding: 8px 6px;\n  border-radius: 9px;\n  font-size: 13.5px;\n  color: var(--muted-foreground);\n  font-weight: 500;\n  transition: background 0.15s ease, color 0.15s ease;\n}\n.seg-btn.is-active {\n  background: var(--card);\n  color: var(--foreground);\n  font-weight: 700;\n  box-shadow: var(--shadow-card);\n}\n.seg-num { font-variant-numeric: tabular-nums; }\n\n/* ===================== \u5217\u8868\u6eda\u52a8\u533a ===================== */\n.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }\n.scroll-area .inner { padding: 2px 16px 18px; }\n.scroll-area::-webkit-scrollbar { width: 0; }\n\n.list { display: flex; flex-direction: column; gap: 8px; }\n\n/* ===================== \u7edf\u8ba1\u5361\uff08\u5df2\u7ed3\u675f\uff09 ===================== */\n.stats { display: flex; gap: 10px; margin-bottom: 10px; }\n.stat-card {\n  flex: 1;\n  background: var(--card);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 12px 10px;\n  text-align: center;\n  box-shadow: var(--shadow-card);\n}\n.stat-card strong { display: block; font-size: 22px; font-weight: 700; }\n.stat-card span { font-size: 11.5px; color: var(--muted-foreground); }\n\n/* ===================== \u7a7a\u72b6\u6001 ===================== */\n.empty {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 10px;\n  margin-top: 26px;\n  padding: 30px 16px;\n  background: var(--card);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  color: var(--muted-foreground);\n  font-size: 13px;\n}\n.empty svg { width: 34px; height: 34px; opacity: 0.55; }\n.empty small { font-size: 11.5px; opacity: 0.85; }\n\n/* ===================== \u7d27\u51d1\u5361\u7247 ===================== */\n.card-mini {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  padding: 11px 14px;\n  background: var(--card);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-card);\n  text-align: left;\n  width: 100%;\n}\n.card-mini:active { background: #fafbfc; }\n.card-mini-left { display: flex; align-items: center; gap: 8px; min-width: 0; }\n.card-mini-name {\n  font-size: 14.5px;\n  font-weight: 600;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.card-mini-right { display: flex; align-items: center; gap: 8px; flex: none; }\n.card-mini-time { font-size: 12.5px; color: var(--muted-foreground); }\n.card-mini-chevron { width: 15px; height: 15px; color: #b6bcc6; flex: none; }\n\n/* ===================== \u72b6\u6001\u70b9 / \u5fbd\u7ae0 ===================== */\n.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted-foreground); }\n.dot--pending { background: var(--success); }\n.dot--running { background: var(--warning); }\n.dot--done { background: #a8b0bb; }\n\n.badge {\n  display: inline-flex;\n  align-items: center;\n  padding: 1px 7px;\n  border-radius: 7px;\n  background: var(--secondary);\n  border: 1px solid var(--border);\n  font-size: 11px;\n  color: var(--muted-foreground);\n  flex: none;\n}\n\n/* ===================== \u5c55\u5f00\u5927\u5361\u7247 ===================== */\n.card {\n  background: var(--card);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: 14px 16px 16px;\n  box-shadow: var(--shadow-card);\n}\n.card-head {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  width: 100%;\n  padding-bottom: 12px;\n  border-bottom: 1px solid var(--border);\n  text-align: left;\n}\n.card-name { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; }\n.card-head-time { font-size: 14px; font-weight: 600; color: var(--foreground); flex: none; }\n.card-head-chevron { width: 16px; height: 16px; color: #b6bcc6; flex: none; }\n\n.spec-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px 12px;\n  padding: 12px 0 4px;\n}\n.spec-item { font-size: 13px; color: var(--muted-foreground); }\n.spec-item b { font-weight: 500; color: #4b5563; }\n\n.timer {\n  display: block;\n  text-align: center;\n  font-size: 46px;\n  line-height: 1.15;\n  font-weight: 700;\n  letter-spacing: 1px;\n  margin: 6px 0 12px;\n}\n.timer--done { font-size: 22px; margin: 4px 0 12px; }\n\n.progress {\n  height: 8px;\n  border-radius: 999px;\n  background: var(--track);\n  overflow: hidden;\n  margin-bottom: 10px;\n}\n.progress > i {\n  display: block;\n  height: 100%;\n  width: 0;\n  border-radius: 999px;\n  background: var(--primary);\n  transition: width 0.4s linear;\n}\n\n.meta-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  font-size: 13px;\n  color: var(--muted-foreground);\n  margin-bottom: 14px;\n}\n.meta-row .meta-right { text-align: right; }\n.meta-row .over { color: var(--destructive); }\n\n.card-actions { display: flex; gap: 10px; }\n.btn-soft {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 12px 14px;\n  border-radius: 11px;\n  border: 1px solid var(--border);\n  background: var(--card);\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--foreground);\n  flex: 0 0 auto;\n}\n.btn-soft svg { width: 16px; height: 16px; flex: none; }\n.btn-soft:active { background: var(--secondary); }\n.btn-block { flex: 1; }\n\n.btn-danger {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  flex: 1;\n  padding: 12px 14px;\n  border-radius: 11px;\n  background: var(--destructive);\n  color: var(--destructive-foreground);\n  font-size: 14.5px;\n  font-weight: 600;\n}\n.btn-danger svg { width: 15px; height: 15px; flex: none; }\n.btn-danger:active { background: var(--destructive-press); }\n\n.btn-success {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  flex: 1;\n  padding: 12px 14px;\n  border-radius: 11px;\n  background: var(--success);\n  color: var(--success-foreground);\n  font-size: 14.5px;\n  font-weight: 600;\n}\n.btn-success svg { width: 17px; height: 17px; flex: none; }\n.btn-success:active { filter: brightness(0.94); }\n\n/* ===================== \u5206\u9875 ===================== */\n.pager {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 14px;\n  margin-top: 14px;\n}\n.pager-btn {\n  padding: 8px 14px;\n  border-radius: 9px;\n  background: var(--secondary);\n  font-size: 13px;\n  color: var(--foreground);\n}\n.pager-btn:disabled { color: #b6bcc6; opacity: 0.8; }\n.pager-info { font-size: 12.5px; color: var(--muted-foreground); }\n\n/* ===================== \u5e95\u90e8\u56fa\u5b9a\u6309\u94ae ===================== */\n.bottom-bar {\n  flex: none;\n  padding: 10px 16px calc(12px + var(--safe-bottom));\n  background: linear-gradient(180deg, rgba(245, 246, 248, 0.7), var(--background) 40%);\n}\n.primary-pill {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  width: 100%;\n  padding: 15px;\n  border-radius: 999px;\n  background: var(--primary);\n  color: var(--primary-foreground);\n  font-size: 16px;\n  font-weight: 600;\n  box-shadow: 0 6px 16px rgba(46, 158, 176, 0.28);\n}\n.primary-pill svg { width: 18px; height: 18px; }\n.primary-pill:active { background: var(--primary-press); }\n\n/* ===================== \u8868\u5355\u9875 ===================== */\n.form { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }\n.field { display: flex; flex-direction: column; gap: 8px; }\n.field-label { font-size: 13.5px; font-weight: 600; color: #2b3038; }\n.field-card {\n  background: var(--card);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 13px 14px;\n  box-shadow: var(--shadow-card);\n}\n.field-card:focus-within { border-color: var(--primary); }\n.field-input { width: 100%; border: none; outline: none; background: transparent; font-size: 15px; }\n.field-input::placeholder { color: #9aa1ac; }\n.field-select {\n  width: 100%;\n  border: none;\n  outline: none;\n  background: transparent;\n  font-size: 15px;\n  appearance: none;\n  -webkit-appearance: none;\n  background-image: linear-gradient(45deg, transparent 50%, #98a0ab 50%), linear-gradient(135deg, #98a0ab 50%, transparent 50%);\n  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;\n  background-size: 5px 5px, 5px 5px;\n  background-repeat: no-repeat;\n  padding-right: 26px;\n}\n.field-tip, .field-auto {\n  margin: 0;\n  font-size: 12.5px;\n  color: var(--primary);\n  font-weight: 500;\n}\n.field-card--auto { border-color: #cfe8ee; }\n.primary-btn {\n  margin-top: 4px;\n  width: 100%;\n  padding: 15px;\n  border-radius: var(--radius);\n  background: var(--primary);\n  color: var(--primary-foreground);\n  font-size: 16px;\n  font-weight: 600;\n}\n.primary-btn:active { background: var(--primary-press); }\n.form-hint {\n  margin: 0;\n  text-align: center;\n  font-size: 12px;\n  color: var(--muted-foreground);\n}\n\n/* ===================== \u5f39\u7a97 ===================== */\n.modal-root {\n  position: fixed;\n  inset: 0;\n  z-index: 200;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n  background: rgba(15, 23, 42, 0.42);\n  animation: fade 0.16s ease;\n}\n.modal {\n  width: 100%;\n  max-width: 340px;\n  background: var(--card);\n  border-radius: 16px;\n  padding: 20px 18px 14px;\n  animation: pop 0.18s ease;\n}\n.modal h2 { margin: 0 0 8px; font-size: 16.5px; font-weight: 700; text-align: center; }\n.modal .modal-body {\n  margin: 0 0 16px;\n  font-size: 14px;\n  color: #3f4550;\n  text-align: center;\n  white-space: pre-line;\n  line-height: 1.6;\n}\n.modal .modal-body strong { color: var(--primary); }\n.modal-actions { display: flex; gap: 10px; }\n.modal-btn {\n  flex: 1;\n  padding: 12px;\n  border-radius: 11px;\n  background: var(--secondary);\n  font-size: 15px;\n  font-weight: 500;\n}\n.modal-btn--primary { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }\n\n/* \u63d0\u9192\u8bbe\u7f6e\u9762\u677f */\n.modal--settings { max-width: 360px; text-align: left; }\n.set-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n  margin-top: 14px;\n  font-size: 13.5px;\n}\n.set-row b { flex: none; font-size: 12.5px; font-weight: 600; color: var(--muted-foreground); }\n.set-wide { width: 100%; margin-top: 10px; }\n.set-label { display: block; margin: 10px 0 6px; font-size: 12px; color: var(--muted-foreground); }\n.set-input {\n  width: 100%;\n  padding: 11px 12px;\n  border: 1px solid var(--border);\n  border-radius: 10px;\n  background: var(--card);\n  font-size: 14px;\n  outline: none;\n}\n.set-input:focus { border-color: var(--primary); }\n.set-actions { display: flex; gap: 8px; margin-top: 10px; }\n.set-hint {\n  margin: 10px 0 0;\n  font-size: 11.5px;\n  line-height: 1.55;\n  color: var(--muted-foreground);\n}\n.set-hint.is-ok { color: var(--success); }\n.modal-btn--danger { background: var(--destructive); color: var(--destructive-foreground); font-weight: 600; }\n.modal-btn:active { opacity: 0.88; }\n\n@keyframes fade { from { opacity: 0; } to { opacity: 1; } }\n@keyframes pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }\n\n/* ===================== \u5230\u70b9\u54cd\u94c3\uff08\u95f9\u949f\uff09 ===================== */\n.alarm-root {\n  position: fixed;\n  inset: 0;\n  z-index: 400;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 22px;\n  background: rgba(15, 23, 42, 0.72);\n}\n.alarm-card {\n  width: 100%;\n  max-width: 340px;\n  padding: 24px 20px 18px;\n  border-radius: 20px;\n  background: var(--card);\n  text-align: center;\n  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);\n  animation: pop 0.2s ease;\n}\n.alarm-bell {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 58px;\n  height: 58px;\n  padding: 13px;\n  border-radius: 50%;\n  background: var(--destructive);\n  color: #fff;\n  animation: bell-pulse 1.1s ease-in-out infinite;\n}\n.alarm-kicker {\n  margin: 12px 0 0;\n  font-size: 12.5px;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--destructive);\n}\n.alarm-title { margin: 4px 0 0; font-size: 21px; font-weight: 700; }\n.alarm-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--muted-foreground); }\n\n.alarm-times { display: flex; gap: 10px; margin: 16px 0 18px; }\n.alarm-times > div {\n  flex: 1;\n  padding: 10px 6px;\n  border-radius: 12px;\n  background: var(--secondary);\n}\n.alarm-times strong { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }\n.alarm-times span { font-size: 11.5px; color: var(--muted-foreground); }\n\n.alarm-stop {\n  width: 100%;\n  padding: 15px;\n  border-radius: 13px;\n  background: var(--destructive);\n  color: var(--destructive-foreground);\n  font-size: 17px;\n  font-weight: 700;\n}\n.alarm-stop:active { background: var(--destructive-press); }\n\n.alarm-rows { display: flex; gap: 8px; margin-top: 10px; }\n.alarm-btn {\n  flex: 1;\n  padding: 11px 8px;\n  border-radius: 11px;\n  background: var(--secondary);\n  font-size: 13px;\n  font-weight: 500;\n}\n.alarm-btn:active { background: var(--muted); }\n\n.alarm-ics {\n  margin-top: 12px;\n  font-size: 12px;\n  color: var(--muted-foreground);\n  text-decoration: underline;\n}\n\n@keyframes bell-pulse {\n  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(213, 55, 44, 0.45); }\n  50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(213, 55, 44, 0); }\n}\n\n/* ===================== \u8f7b\u63d0\u793a ===================== */\n.toast-root {\n  position: fixed;\n  left: 50%;\n  bottom: calc(96px + var(--safe-bottom));\n  transform: translateX(-50%);\n  z-index: 300;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  align-items: center;\n  pointer-events: none;\n  width: max-content;\n  max-width: 88vw;\n}\n.toast {\n  padding: 10px 16px;\n  border-radius: 999px;\n  background: rgba(23, 27, 33, 0.9);\n  color: #fff;\n  font-size: 13.5px;\n  text-align: center;\n  animation: toast-in 0.2s ease;\n}\n.toast--ok { background: rgba(17, 138, 62, 0.95); }\n@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }\n\n/* ===================== \u81ea\u5b9a\u4e49\u6ed1\u52a8\u9009\u62e9\u5668 ===================== */\n.picker-trigger {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  text-align: left;\n  font-size: 15px;\n  color: inherit;\n}\n.picker-trigger[aria-expanded=\"true\"] { border-color: var(--primary); }\n.picker-value {\n  flex: 1;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n.picker-chevron {\n  width: 16px;\n  height: 16px;\n  flex: none;\n  color: #98a0ab;\n  transition: transform 0.2s ease;\n}\n.picker-trigger[aria-expanded=\"true\"] .picker-chevron { transform: rotate(180deg); }\n\n/* \u836f\u54c1\u540d\u79f0\uff1a\u624b\u52a8\u8f93\u5165 + \u89c4\u8303\u5e93\u9009\u62e9\u5408\u5e76\u4e3a\u4e00\u4e2a\u63a7\u4ef6 */\n.picker-field { display: flex; align-items: center; gap: 8px; }\n.picker-field .field-input { flex: 1; min-width: 0; }\n.picker-toggle {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 30px;\n  height: 30px;\n  margin: -4px -5px -4px 0;\n  flex: none;\n  border-radius: 8px;\n  color: #98a0ab;\n}\n.picker-toggle:active { background: var(--secondary); }\n.picker-toggle .picker-chevron { width: 16px; height: 16px; }\n.picker-toggle[aria-expanded=\"true\"] .picker-chevron { transform: rotate(180deg); }\n\n.picker-root {\n  position: fixed;\n  inset: 0;\n  z-index: 250;\n  display: flex;\n  align-items: flex-end;\n  justify-content: center;\n  background: rgba(15, 23, 42, 0.42);\n}\n/* \u906e\u7f69\u9ed8\u8ba4\u5c31\u662f\u53ef\u89c1\u7684\uff1a\u6253\u5f00\u4e0d\u4f9d\u8d56\u8fc7\u6e21\uff0c\u675c\u7edd\u300c\u9762\u677f\u900f\u660e\u5374\u62e6\u622a\u70b9\u51fb\u300d */\n.picker-root.is-closing {\n  opacity: 0;\n  transition: opacity 0.18s ease;\n}\n\n.picker-sheet {\n  display: flex;\n  flex-direction: column;\n  width: 100%;\n  max-width: 480px;\n  max-height: 78vh;\n  padding: 8px 0 calc(6px + var(--safe-bottom));\n  background: var(--card);\n  border-radius: 18px 18px 0 0;\n  box-shadow: 0 -12px 40px rgba(16, 24, 40, 0.18);\n  transform: translateY(100%);\n  transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);\n}\n.picker-root.is-open .picker-sheet { transform: translateY(0); }\n\n.picker-grabber {\n  display: block;\n  width: 40px;\n  height: 4px;\n  margin: 2px auto 6px;\n  border-radius: 999px;\n  background: #e0e4ea;\n}\n.picker-head {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 2px 16px 10px;\n  border-bottom: 1px solid var(--border);\n}\n.picker-title { flex: 1; font-size: 14.5px; font-weight: 600; color: #2b3038; }\n.picker-close {\n  width: 26px;\n  height: 26px;\n  flex: none;\n  padding: 5px;\n  border-radius: 50%;\n  color: var(--muted-foreground);\n}\n.picker-close:active { background: var(--secondary); }\n\n.picker-list {\n  position: relative; /* \u8ba9\u9009\u4e2d\u9879 offsetTop \u4ee5\u5217\u8868\u4e3a\u53c2\u7167\uff0c\u6253\u5f00\u65f6\u624d\u80fd\u5b9a\u4f4d\u5230\u5f53\u524d\u503c */\n  max-height: 52vh;\n  padding: 6px 8px 4px;\n  overflow-y: auto;\n  -webkit-overflow-scrolling: touch;\n  overscroll-behavior: contain;\n  scroll-snap-type: y proximity;\n}\n.picker-list::-webkit-scrollbar { width: 0; }\n\n.picker-group {\n  padding: 8px 10px 4px;\n  font-size: 11.5px;\n  font-weight: 600;\n  letter-spacing: 0.3px;\n  color: var(--muted-foreground);\n}\n\n.picker-item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  padding: 11px 12px;\n  border-radius: 11px;\n  text-align: left;\n  scroll-snap-align: center;\n  transition: background 0.15s ease;\n}\n.picker-item:active { background: var(--secondary); }\n.picker-item.is-selected { background: var(--primary-soft); }\n.picker-item-body { flex: 1; min-width: 0; }\n.picker-item-label { display: block; font-size: 15px; font-weight: 500; color: var(--foreground); }\n.picker-item.is-selected .picker-item-label { color: var(--primary); font-weight: 600; }\n.picker-item-hint { display: block; margin-top: 2px; font-size: 12px; color: var(--muted-foreground); }\n.picker-item-check {\n  width: 17px;\n  height: 17px;\n  flex: none;\n  color: var(--primary);\n  opacity: 0;\n  transition: opacity 0.15s ease;\n}\n.picker-item.is-selected .picker-item-check { opacity: 1; }\n\n.picker-foot { padding: 8px 16px 2px; text-align: center; }\n.picker-hint { font-size: 11.5px; color: var(--muted-foreground); }\n\n\n\n/* ===================== \u8f93\u6db2\u89c4\u8303\u53c2\u7167\uff08\u8868\u5355\uff09 ===================== */\n.spec-ref {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  padding: 14px;\n  background: var(--card);\n  border: 1px solid #d9e9ee;\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-card);\n}\n.spec-ref-head { display: flex; align-items: center; gap: 8px; }\n.spec-ref-title {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--primary);\n}\n.spec-ref-title svg { width: 15px; height: 15px; flex: none; }\n.spec-ref-level {\n  margin-left: auto;\n  padding: 3px 9px;\n  border-radius: 999px;\n  background: var(--primary-soft);\n  color: var(--primary);\n  font-size: 11.5px;\n  font-weight: 600;\n}\n.spec-ref-level[data-tone=\"care\"] { background: #fef3e2; color: #b45309; }\n.spec-ref-level[data-tone=\"slow\"] { background: #fdeaea; color: var(--destructive); }\n\n.spec-ref-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }\n.spec-ref-time {\n  font-size: 23px;\n  font-weight: 700;\n  color: var(--foreground);\n  font-variant-numeric: tabular-nums;\n}\n.spec-ref-cap { font-size: 12.5px; color: var(--muted-foreground); }\n\n.spec-ref-grid { display: flex; flex-direction: column; gap: 6px; }\n.spec-ref-row { display: flex; gap: 10px; font-size: 12.5px; }\n.spec-ref-row span { flex: none; width: 62px; color: var(--muted-foreground); }\n.spec-ref-row b { flex: 1; min-width: 0; font-weight: 500; color: #4b5563; }\n\n.spec-ref-note { margin: 0; font-size: 12px; line-height: 1.55; color: #6b7280; }\n.spec-ref-warn { margin: 0; font-size: 12px; line-height: 1.55; color: var(--destructive); }\n\n.spec-ref-apply {\n  align-self: flex-start;\n  padding: 8px 14px;\n  border-radius: 10px;\n  background: var(--primary-soft);\n  color: var(--primary);\n  font-size: 13px;\n  font-weight: 600;\n}\n.spec-ref-apply:active { background: #d8ecf1; }\n\n/* \u5361\u7247\u5185\u89c4\u8303\u53c2\u7167\u884c */\n.card-spec-ref {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n  flex-wrap: wrap;\n  margin: 2px 0 10px;\n  padding: 8px 10px;\n  border-radius: 10px;\n  background: var(--primary-soft);\n  font-size: 12px;\n  line-height: 1.5;\n  color: #35606b;\n}\n.card-spec-ref-tag { flex: none; font-weight: 600; color: var(--primary); }\n.card-spec-ref-text { flex: 1; min-width: 0; }\n.card-spec-ref-time {\n  flex: none;\n  font-weight: 600;\n  color: var(--primary);\n  font-variant-numeric: tabular-nums;\n}\n\n/* ===================== \u5bbd\u5c4f\uff08\u684c\u9762\u9884\u89c8\uff09 ===================== */\n@media (min-width: 481px) {\n  .app-shell { box-shadow: 0 0 0 1px #dfe3e8, 0 18px 50px rgba(16, 24, 40, 0.12); }\n}\n\n\u003c/style>\n\u003cstyle>#btn-not atedTs: Date.now(),\n    };\n    const list = loadTasks();\n    list.unshift(task);\n    writeTasks(verifyTasks(list));\n    return task;\n  }\n\n  /**\n   * \u72b6\u6001\u63a8\u8fdb\uff1astart(pending\u2192running) / finish(running\u2192done)\n   * \u9632\u5dee\u9519\uff1a\u5148\u91cd\u8f7d\u6821\u9a8c\u72b6\u6001\u5408\u6cd5\u624d\u63a8\u8fdb\uff1b\u63a8\u8fdb\u540e\u5355\u6761\u590d\u9a8c\uff0c\u901a\u4e0d\u8fc7\u4e0d\u5199\u3002\n   */\n  function advance(id, type) {\n    const list = loadTasks();\n    const idx = list.findIndex((t) => t.id === id);\n    if (idx \u003c 0) return null;\n    const task = list[idx];\n    const now = Date.now();\n\n    const allowed =\n      (type === 'start' && task.status === 'pending') ||\n      (type === 'finish' && task.status === 'running');\n    if (!allowed) return null;\n\n    const next = Object.assign({}, task);\n    if (type === 'start') {\n      next.startTs = now;\n      next.status = 'running';\n    } else {\n      next.endTs = now;\n      next.status = 'done';\n    }\n\n    const recheck = verifyTask(next);\n    if (!recheck || recheck.id !== id) return null;\n\n    list.splice(idx, 1, recheck);\n    writeTasks(verifyTasks(list));\n    return recheck;\n  }\n\n  function removeTask(id) {\n    writeTasks(loadTasks().filter((t) => t.id !== id));\n  }\n\n  /* ---------------- \u8ba1\u7b97\u4e0e\u683c\u5f0f\u5316 ---------------- */\n\n  function fmtDuration(ms) {\n    if (!Number.isFinite(ms) || ms \u003c 0) ms = 0;\n    const totalSec = Math.floor(ms / 1000);\n    const h = Math.floor(totalSec / 3600);\n    const m = Math.floor((totalSec % 3600) / 60);\n    const s = totalSec % 60;\n    const mm = String(m).padStart(2, '0');\n    const ss = String(s).padStart(2, '0');\n    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;\n  }\n\n  /** \u53cb\u597d\u65f6\u957f\uff1a1h 15min / 45min */\n  function fmtHuman(ms) {\n    if (!Number.isFinite(ms) || ms \u003c 0) ms = 0;\n    const totalMin = Math.round(ms / 60000);\n    const h = Math.floor(totalMin / 60);\n    const m = totalMin % 60;\n    if (h > 0 && m > 0) return h + 'h ' + m + 'min';\n    if (h > 0) return h + 'h';\n    return m + 'min';\n  }\n\n  function fmtClock(ts) {\n    if (!ts) return '--:--';\n    const d = new Date(ts);\n    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');\n  }\n\n  function fmtMonthDay(ts) {\n    if (!ts) return '';\n    const d = new Date(ts);\n    return (d.getMonth() + 1) + '/' + d.getDate();\n  }\n\n  /** \u5df2\u8f93\u6ce8\u6beb\u79d2\u6570 */\n  function elapsedMs(task, now) {\n    if (!task.startTs) return 0;\n    const end = task.endTs || now;\n    return Math.max(0, end - task.startTs);\n  }\n\n  /** \u5269\u4f59\u6beb\u79d2\u6570\uff08\u4ec5 running\uff1b\u53ef\u80fd\u4e3a\u8d1f = \u8d85\u8fc7\u53c2\u8003\u65f6\u957f\uff09 */\n  function remainingMs(task, now) {\n    if (task.status !== 'running') return Infinity;\n    return task.expectedMin * 60 * 1000 - elapsedMs(task, now);\n  }\n\n  /** \u8fdb\u5ea6 0~1 */\n  function progress(task, now) {\n    const total = task.expectedMin * 60 * 1000;\n    if (total \u003c= 0) return 0;\n    return Math.min(1, elapsedMs(task, now) / total);\n  }\n\n  /** \u53c2\u8003\u65f6\u957f\uff1a\u5206\u949f = \u603b\u91cfml \u00d7 \u6ef4\u7cfb\u6570 \u00f7 \u6ef4\u901f\uff08\u81f3\u5c11 1 \u5206\u949f\uff09 */\n  function calcMinutes(totalMl, dripFactor, dripRate) {\n    if (!(totalMl > 0) || !(dripFactor > 0) || !(dripRate > 0)) return null;\n    return Math.max(1, Math.round((totalMl * dripFactor) / dripRate));\n  }\n\n  /* ============================================================\n   * \u4e8c\u3001\u6d4f\u89c8\u5668\u80fd\u529b\u5c01\u88c5\uff08modal / toast / vibrate / \u901a\u77e5 / \u65e5\u5386\uff09\n   * ============================================================ */\n\n  const $ = (sel, root) => (root || document).querySelector(sel);\n  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));\n\n  function esc(str) {\n    return String(str == null ? '' : str)\n      .replace(/&/g, '&amp;')\n      .replace(/\u003c/g, '&lt;')\n      .replace(/>/g, '&gt;')\n      .replace(/\"/g, '&quot;');\n  }\n\n  /** \u81ea\u5efa\u5f39\u7a97\uff0c\u66ff\u4ee3 Taro.showModal */\n  function showModal(opts) {\n    return new Promise((resolve) => {\n      const root = $('#modal-root');\n      const showCancel = opts.showCancel !== false;\n      root.hidden = false;\n      root.innerHTML =\n        '\u003cdiv class=\"modal\" role=\"dialog\" aria-modal=\"true\">' +\n        '\u003ch2>' + esc(opts.title) + '\u003c/h2>' +\n        '\u003cp class=\"modal-body\">' + esc(opts.content || '') + '\u003c/p>' +\n        '\u003cdiv class=\"modal-actions\">' +\n        (showCancel ? '\u003cbutton type=\"button\" class=\"modal-btn\" data-result=\"0\">' + esc(opts.cancelText || '\u53d6\u6d88') + '\u003c/button>' : '') +\n        '\u003cbutton type=\"button\" class=\"modal-btn ' +\n        (opts.tone === 'danger' ? 'modal-btn--danger' : 'modal-btn--primary') +\n        '\" data-result=\"1\">' + esc(opts.confirmText || '\u786e\u5b9a') + '\u003c/button>' +\n        '\u003c/div>\u003c/div>';\n\n      const close = (value) => {\n        root.hidden = true;\n        root.innerHTML = '';\n        resolve(value);\n      };\n\n      $$('[data-result]', root).forEach((btn) => {\n        btn.addEventListener('click', () => close(btn.getAttribute('data-result') === '1'));\n      });\n      root.addEventListener('click', (e) => {\n        if (e.target === root) close(false);\n      });\n    });\n  }\n\n  /** \u81ea\u5efa\u8f7b\u63d0\u793a\uff0c\u66ff\u4ee3 Taro.showToast */\n  function showToast(message, ok) {\n    const root = $('#toast-root');\n    const el = document.createElement('div');\n    el.className = 'toast' + (ok ? ' toast--ok' : '');\n    el.textContent = message;\n    root.appendChild(el);\n    window.setTimeout(() => {\n      el.style.transition = 'opacity .25s ease';\n      el.style.opacity = '0';\n      window.setTimeout(() => el.remove(), 280);\n    }, ok ? 1600 : 2600);\n  }\n\n  /** \u9707\u52a8\u53cd\u9988\uff0c\u66ff\u4ee3 Taro.vibrateLong / vibrateShort */\n  function vibrate(long) {\n    try {\n      if (navigator.vibrate) navigator.vibrate(long ? [80, 60, 80] : 35);\n    } catch (e) { /* \u4e0d\u652f\u6301\u7684\u73af\u5883\u5ffd\u7565 */ }\n  }\n\n  /* ---------------- \u7cfb\u7edf\u901a\u77e5\uff08\u56fe\u7247\u4e2d\u7684\u300c\u5f00\u542f\u63a8\u9001\u300d\uff09 ---------------- */\n\n  const notifySupported = () => typeof window.Notification !== 'undefined';\n\n  function notifyGranted() {\n    return notifySupported() && Notification.permission === 'granted';\n  }\n\n  function pushNotify(title, body) {\n    if (!notifyGranted()) return;\n    try {\n      // eslint-disable-next-line no-new\n      new Notification(title, { body: body, tag: 'iv-timer', icon: './icon.svg' });\n    } catch (e) { /* \u90e8\u5206\u6d4f\u89c8\u5668\u9700 ServiceWorker\uff0c\u5ffd\u7565 */ }\n  }\n\n  const ALARM_KEY = 'iv_alarm_pref';\n\n  /** \u97f3\u91cf\u6863\u4f4d\uff08\u54cd\u94c3\u9762\u677f/\u8bbe\u7f6e\u91cc\u5faa\u73af\u5207\u6362\uff09 */\n  const ALARM_VOLUMES = [\n    { value: 1, label: '\u6700\u5927' },\n    { value: 0.9, label: '\u5f88\u5927' },\n    { value: 0.8, label: '\u8f83\u5927' },\n  ];\n\n  function volumeLabel(v) {\n    const hit = ALARM_VOLUMES.filter((x) => x.value === v)[0];\n    return hit ? hit.label : '\u6700\u5927';\n  }\n\n  function alarmPref() {\n    const raw = lsGet(ALARM_KEY, null);\n    return {\n      sound: raw && ALARM_SOUNDS[raw.sound] ? raw.sound : 'alert',\n      // \u65e7\u7248\u672c\u9ed8\u8ba4 0.6 \u660e\u663e\u504f\u5c0f\uff1a\u5c0f\u4e8e 0.8 \u7684\u4e00\u5f8b\u6309\u6700\u5927\u97f3\u91cf\u8d77\u6b65\n      volume: raw && Number.isFinite(raw.volume) && raw.volume >= 0.8 ? raw.volume : 1,\n    };\n  }\n\n  function setAlarmPref(patch) {\n    lsSet(ALARM_KEY, Object.assign(alarmPref(), patch));\n  }\n\n  /** \u63d0\u9192\u5c31\u7eea = \u901a\u77e5\u5df2\u6388\u6743\u4e14\u97f3\u9891\u5df2\u89e3\u9501\uff08\u6d4f\u89c8\u5668\u8981\u6c42\u7528\u6237\u624b\u52bf\u540e\u624d\u80fd\u51fa\u58f0\uff09 */\n  function alertReady() {\n    return notifyGranted() && !!audioCtx;\n  }\n\n  function syncNotifyButton() {\n    const btn = $('#btn-notify');\n    const text = $('#notify-text');\n    if (!btn) return;\n    const on = alertReady() || ntfyConfig().enabled; // \u8fdc\u7a0b\u63a8\u9001\u4e5f\u7b97\u5df2\u5f00\u542f\n    btn.classList.toggle('is-on', on);\n    if (text) {\n      if (on) text.textContent = '\u63d0\u9192\u5df2\u5f00\u542f';\n      else if (notifySupported() && Notification.permission === 'denied') text.textContent = '\u901a\u77e5\u88ab\u7981\u7528';\n      else text.textContent = '\u5f00\u542f\u63d0\u9192';\n    }\n  }\n\n  /** \u5f00\u542f\u63d0\u9192\uff1a\u89e3\u9501\u97f3\u9891\uff08\u54cd\u94c3\uff09+ \u7533\u8bf7\u7cfb\u7edf\u901a\u77e5\u6743\u9650 */\n  async function enableAlert() {\n    keepAllowed = true; // \u7528\u6237\u624b\u52bf\u6765\u4e86\uff1a\u5141\u8bb8\u64ad\u653e\uff08\u54cd\u94c3 + \u540e\u53f0\u4fdd\u6d3b\uff09\n    const ctx = ensureAudio();\n    if (!ctx) {\n      showToast('\u5f53\u524d\u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u94c3\u58f0\uff0c\u5c06\u7528\u9707\u52a8 + \u901a\u77e5\u63d0\u9192');\n    } else {\n      playTone(ctx, 987.77, ctx.currentTime + 0.02, 0.2, 'sine', 0.5); // \u8bd5\u542c\u4e00\u58f0\uff0c\u786e\u8ba4\u5df2\u89e3\u9501\n      vibrate(false);\n    }\n\n    if (!notifySupported()) {\n      showToast('\u63d0\u9192\u5df2\u5f00\u542f\uff1a\u5230\u70b9\u4f1a\u54cd\u94c3\u63d0\u9192', true);\n      syncNotifyButton();\n      return;\n    }\n    if (Notification.permission === 'granted') {\n      showToast('\u63d0\u9192\u5df2\u5f00\u542f\uff1a\u5230\u70b9\u54cd\u94c3 + \u7cfb\u7edf\u901a\u77e5', true);\n      syncNotifyButton();\n      return;\n    }\n    if (Notification.permission === 'denied') {\n      showToast('\u901a\u77e5\u672a\u6388\u6743\uff0c\u5230\u70b9\u4ecd\u4f1a\u54cd\u94c3\u63d0\u9192');\n      syncNotifyButton();\n      return;\n    }\n    try {\n      const res = await Notification.requestPermission();\n      showToast(res === 'granted' ? '\u63d0\u9192\u5df2\u5f00\u542f\uff1a\u5230\u70b9\u54cd\u94c3 + \u7cfb\u7edf\u901a\u77e5' : '\u901a\u77e5\u672a\u6388\u6743\uff0c\u5230\u70b9\u4ecd\u4f1a\u54cd\u94c3\u63d0\u9192', res === 'granted');\n    } catch (e) {\n      showToast('\u901a\u77e5\u672a\u6388\u6743\uff0c\u5230\u70b9\u4ecd\u4f1a\u54cd\u94c3\u63d0\u9192');\n    }\n    syncNotifyButton();\n  }\n\n  /* ---------------- .ics \u65e5\u5386\u4e0b\u8f7d\uff08\u7167\u642c\u6e90\u7801\u903b\u8f91\uff09 ---------------- */\n\n  function downloadIcs(task, cancel) {\n    if (!task.startTs) return;\n    const pad = (n) => String(n).padStart(2, '0');\n    const fmtIcs = (ts) => {\n      const d = new Date(ts);\n      return (\n        d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' +\n        pad(d.getHours()) + pad(d.getMinutes()) + '00'\n      );\n    };\n    const endTs = task.startTs + task.expectedMin * 60 * 1000;\n    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0'];\n    if (cancel) lines.push('METHOD:CANCEL');\n    lines.push('BEGIN:VEVENT');\n    lines.push('UID:' + task.id + '@iv-timer');\n    lines.push('DTSTART:' + fmtIcs(endTs));\n    lines.push('DTEND:' + fmtIcs(endTs + 5 * 60 * 1000));\n    lines.push('SUMMARY:' + (cancel ? '\u2705 \u5df2\u5b8c\u6210 ' : '\u23f0 ') + task.label + ' \u9884\u8ba1\u8f93\u5b8c');\n    lines.push('DESCRIPTION:\u53c2\u8003\u65f6\u957f ' + task.expectedMin + ' \u5206\u949f\uff0c\u8bf7\u67e5\u770b\u8f93\u6ce8\u60c5\u51b5');\n    if (cancel) {\n      lines.push('STATUS:CANCELLED', 'SEQUENCE:1');\n    } else {\n      lines.push('BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY', 'END:VALARM');\n    }\n    lines.push('END:VEVENT', 'END:VCALENDAR');\n\n    const blob = new Blob([lines.join('\\r\\n')], { type: 'text/calendar;charset=utf-8' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = task.label + '-' + (cancel ? '\u53d6\u6d88\u63d0\u9192' : '\u63d0\u9192') + '.ics';\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n    window.setTimeout(() => URL.revokeObjectURL(url), 1000);\n    showToast(cancel ? '\u5df2\u4e0b\u8f7d\uff0c\u6253\u5f00\u5373\u53ef\u5220\u9664\u65e5\u5386\u63d0\u9192' : '\u5df2\u4e0b\u8f7d\uff0c\u70b9\u300c\u6253\u5f00 \u2192 \u6dfb\u52a0\u5230\u65e5\u5386\u300d\u5373\u53ef', true);\n  }\n\n  /* ============================================================\n   * \u4e8c.5\u3001\u5230\u70b9\u95f9\u949f\uff08\u5e94\u7528\u5185\u54cd\u94c3\uff09\n   * ------------------------------------------------------------\n   * - Web Audio \u5b9e\u65f6\u5408\u6210\u94c3\u58f0\uff0c\u65e0\u9700\u97f3\u9891\u6587\u4ef6\u3001\u65e0\u7f51\u7edc\u8bf7\u6c42\n   * - \u5230\u70b9\uff1a\u5faa\u73af\u54cd\u94c3 + \u9707\u52a8 + \u7cfb\u7edf\u901a\u77e5 + \u5168\u5c4f\u300c\u505c\u6b62\u54cd\u94c3\u300d\u9762\u677f\n   * - \u54cd\u94c3\u671f\u95f4\u7533\u8bf7\u5c4f\u5e55\u5e38\u4eae\uff08Wake Lock\uff09\uff0c\u907f\u514d\u9501\u5c4f\u540e\u9759\u9ed8\n   * - \u9875\u9762\u88ab\u7cfb\u7edf\u6302\u8d77\u65f6\uff08\u5982 iOS \u9000\u5230\u540e\u53f0\uff09\u4e0d\u4f1a\u54cd\u94c3\uff0c\u8fd9\u662f\u7f51\u9875\u7248\u7684\n   *   \u56fa\u6709\u9650\u5236\uff0c\u56e0\u6b64\u4fdd\u7559 .ics \u65e5\u5386\u5bfc\u51fa\u4f5c\u4e3a\u540e\u53f0\u515c\u5e95\n   * ============================================================ */\n\n  /* \u53ea\u4fdd\u7559\u4e00\u79cd\u94c3\u58f0\uff1a\u6025\u4fc3\u8b66\u62a5\uff08\u65b9\u6ce2\u8fde\u6ef4\uff0c\u6700\u9192\u76ee\u3001\u7a7f\u900f\u529b\u6700\u5f3a\uff09 */\n  const ALARM_SOUNDS = {\n    alert: { label: '\u6025\u4fc3\u8b66\u62a5', wave: 'square', dur: 0.06, gap: 0.85, seq: [1568, 0, 1568, 0, 1568, 0, 1568, 0, 1568] },\n  };\n  const ALARM_AUTO_STOP_MS = 120000; // \u65e0\u4eba\u5904\u7406\u65f6 2 \u5206\u949f\u81ea\u52a8\u505c\u6b62\n\n  let audioCtx = null;\n  let masterGain = null;\n  let ringTimer = null;\n  let vibeTimer = null;\n  let wakeLock = null;\n\n  const alarm = { list: [], current: null, stopTimer: null, snooze: new Map(), volume: 0.6 };\n\n  function ensureAudio() {\n    const Ctx = window.AudioContext || window.webkitAudioContext;\n    if (!Ctx) return null;\n    if (!audioCtx) {\n      audioCtx = new Ctx();\n      masterGain = audioCtx.createGain();\n      masterGain.gain.value = 1;\n      masterGain.connect(audioCtx.destination);\n    }\n    if (audioCtx.state === 'suspended') {\n      const p = audioCtx.resume();\n      if (p && p.catch) p.catch(() => {});\n    }\n    return audioCtx;\n  }\n\n  function playTone(ctx, freq, at, dur, wave, vol) {\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n    osc.type = wave;\n    osc.frequency.setValueAtTime(freq, at);\n    gain.gain.setValueAtTime(0.0001, at);\n    gain.gain.exponentialRampToValueAtTime(Math.max(0.02, Math.min(1, vol)), at + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);\n    osc.connect(gain);\n    gain.connect(masterGain);\n    osc.start(at);\n    osc.stop(at + dur + 0.03);\n  }\n\n  /** \u64ad\u653e\u4e00\u7ec4\u94c3\u58f0\uff08\u95f9\u949f\u7684\u300c\u4e00\u904d\u300d\uff09 */\n  function playRingBar(soundKey) {\n    const ctx = ensureAudio();\n    if (!ctx) return;\n    const s = ALARM_SOUNDS[soundKey] || ALARM_SOUNDS.alert;\n    const t0 = ctx.currentTime + 0.03;\n    s.seq.forEach((f, i) => {\n      if (f > 0) playTone(ctx, f, t0 + i * (s.dur + 0.05), s.dur, s.wave, 0.95 * alarm.volume);\n    });\n  }\n\n  /* ---------------- WAV \u7f16\u7801\uff1a\u628a\u94c3\u58f0\u79bb\u7ebf\u6e32\u67d3\u6210\u97f3\u9891\u8d44\u6e90 ---------------- */\n  /* \u8d70 \u003caudio> \u64ad\u653e = \u8d70\u7cfb\u7edf\u300c\u5a92\u4f53\u64ad\u653e\u300d\u901a\u9053\uff0c\u5207\u540e\u53f0/\u9501\u5c4f\u540e\u4ecd\u80fd\u51fa\u58f0\uff0c\n     \u8fd9\u662f\u7f51\u9875\u7aef\u80fd\u505a\u5230\u7684\u3001\u6700\u63a5\u8fd1\u7cfb\u7edf\u95f9\u949f\u7684\u65b9\u5f0f\uff08\u5408\u6210\u97f3\u53ea\u5728\u524d\u53f0\u53ef\u9760\uff09 */\n\n  const ringUrlCache = {};\n  let silentUrl = null;\n\n  function encodeWav(samples, sampleRate) {\n    const len = samples.length;\n    const view = new DataView(new ArrayBuffer(44 + len * 2));\n    const str = (off, s) => { for (let i = 0; i \u003c s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };\n    str(0, 'RIFF');\n    view.setUint32(4, 36 + len * 2, true);\n    str(8, 'WAVE');\n    str(12, 'fmt ');\n    view.setUint32(16, 16, true);\n    view.setUint16(20, 1, true);\n    view.setUint16(22, 1, true);\n    view.setUint32(24, sampleRate, true);\n    view.setUint32(28, sampleRate * 2, true);\n    view.setUint16(32, 2, true);\n    view.setUint16(34, 16, true);\n    str(36, 'data');\n    view.setUint32(40, len * 2, true);\n    let off = 44;\n    for (let i = 0; i \u003c len; i++) {\n      const v = Math.max(-1, Math.min(1, samples[i]));\n      view.setInt16(off, v \u003c 0 ? v * 0x8000 : v * 0x7fff, true);\n      off += 2;\n    }\n    return new Blob([view], { type: 'audio/wav' });\n  }\n\n  /** \u7528\u4e0e\u5b9e\u65f6\u5408\u6210\u76f8\u540c\u7684\u97f3\u7b26\u53c2\u6570\uff0c\u79bb\u7ebf\u6e32\u67d3\u300c\u4e00\u904d\u94c3\u58f0\u300d\u4e3a\u53ef\u5faa\u73af\u7684 WAV */\n  function renderRingUrl(soundKey) {\n    if (ringUrlCache[soundKey]) return ringUrlCache[soundKey];\n    const s = ALARM_SOUNDS[soundKey] || ALARM_SOUNDS.alert;\n    const sr = 8000;\n    const dur = Math.max(0.9, s.gap);\n    const len = Math.ceil(dur * sr);\n    const pcm = new Float32Array(len);\n\n    const tone = (freq, startSec, noteDur) => {\n      const from = Math.max(0, Math.floor(startSec * sr));\n      const to = Math.min(len, Math.floor((startSec + noteDur) * sr));\n      for (let i = from; i \u003c to; i++) {\n        const t =
